[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anchorpca"
version = "0.1.0"
description = "Anchor PCA estimators for projector-agreement PCA across environments"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Benedikt Seiter"},
    {name = "Anya Fries"},
    {name = "Julius von Kügelgen"},
    {name = "Jonas Peters"},
]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
]
keywords = ["PCA", "dimension reduction", "domain generalization", "covariance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/benesei/anchor-pca"
Repository = "https://github.com/benesei/anchor-pca"
Paper = "https://arxiv.org/abs/2606.06233"

[project.optional-dependencies]
examples = [
    "matplotlib>=3.4",
    "pandas>=1.3",
]
dev = [
    "pytest>=7.0",
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
